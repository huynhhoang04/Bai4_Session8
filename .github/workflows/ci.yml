name: CI Pull Image

on:
  push:
    branches:
      - main

permissions:
  packages: read

jobs:
  pull-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: github
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d'/' -f2)" >> $GITHUB_OUTPUT

      - name: Pull image
        run: docker pull ${{ steps.image.outputs.name }}

      - name: Run container
        run: docker run -d --rm ${{ steps.image.outputs.name }}
