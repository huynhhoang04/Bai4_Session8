name: CI Pull Image

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  build-and-pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: github
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d'/' -f2)
          docker build -t ghcr.io/${{ github.repository }}/${REPO_NAME}:latest .
          docker push ghcr.io/${{ github.repository }}/${REPO_NAME}:latest

      - name: Pull image
        run: |
          REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d'/' -f2)
          docker pull ghcr.io/${{ github.repository }}/${REPO_NAME}:latest

      - name: Run container
        run: |
          REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d'/' -f2)
          docker run -d --rm ghcr.io/${{ github.repository }}/${REPO_NAME}:latest
