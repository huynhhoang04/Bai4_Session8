name: CI Pull Image

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  build-and-pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: github
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/bai4_session8"
          docker build -t "${IMAGE_NAME}:latest" .
          docker push "${IMAGE_NAME}:latest"

      - name: Pull image
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/bai4_session8"
          docker pull "${IMAGE_NAME}:latest"

      - name: Run container
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/bai4_session8"
          docker run -d --rm "${IMAGE_NAME}:latest"
